<!--
=====================================================================
 A DIGITAL LOVE LETTER (Static HTML version)
=====================================================================
 A single-file, self-contained romantic experience.

 HOW TO PERSONALIZE:
 --------------------------------------------------------------------
 1. Visit the page with URL parameters to personalize instantly:
      index.html?name=HerName&from=YourName

 2. Or just edit the DEFAULT_NAME / DEFAULT_FROM constants and the
    LETTER_PARAGRAPHS array in the <script> near the bottom.
    Everything is clearly commented.

 3. To add "our song", replace the <source> near the bottom of the
    HTML (search for "PLAY OUR SONG") with a link to an mp3 file you
    own the rights to (e.g. assets/our-song.mp3).
=====================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Love Letter</title>

<!-- Google Fonts: Playfair Display + Dancing Script -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Dancing+Script:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --blush:#fbe4e8;
    --rose:#f7c6d0;
    --rose-deep:#e8a0b4;
    --rose-dark:#c96b8a;
    --plum:#7a3b52;
    --gold:#d8b26a;
    --cream:#fff8f5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin:0; padding:0;
    background: linear-gradient(160deg,#fff5f6 0%, #fde9ee 40%, #fbe0e8 100%);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .font-display { font-family: 'Playfair Display', serif; }
  .font-script { font-family: 'Dancing Script', cursive; }

  /* ---------- Floating hearts background ---------- */
  #hearts-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .floating-heart {
    position: fixed;
    bottom: -10%;
    pointer-events: none;
    opacity: 0.55;
    z-index: 1;
    animation: floatUp linear infinite;
    color: var(--rose-deep);
    filter: drop-shadow(0 2px 6px rgba(201,107,138,0.25));
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(var(--s,1)); opacity:0; }
    10% { opacity: 0.6; }
    50% { transform: translateY(-50vh) translateX(20px) rotate(15deg) scale(var(--s,1)); }
    90% { opacity: 0.4; }
    100% { transform: translateY(-110vh) translateX(-15px) rotate(-10deg) scale(var(--s,1)); opacity:0; }
  }

  /* ---------- Envelope Scene ---------- */
  #envelope-scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 1.1s ease, visibility 1.1s ease;
    background: radial-gradient(circle at 50% 40%, #fff3f5 0%, #fbe0e8 60%, #f6cdd9 100%);
  }

  #envelope-scene.hidden-scene {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .envelope-wrap {
    perspective: 1400px;
  }

  .envelope {
    position: relative;
    width: 320px;
    height: 210px;
    cursor: pointer;
    transition: transform .4s ease;
  }
  .envelope:hover { transform: translateY(-6px) scale(1.02); }

  .envelope-body {
    position:absolute; inset:0;
    background: linear-gradient(135deg, #fff 0%, #fdf1f3 100%);
    border-radius: 10px;
    box-shadow: 0 25px 50px -12px rgba(201,107,138,0.45), 0 0 0 1px rgba(232,160,180,.4);
  }

  .envelope-flap {
    position:absolute;
    top:0; left:0; width:100%; height:0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 115px solid #f3c3d0;
    transform-origin: top;
    transition: transform 1s cubic-bezier(.65,0,.35,1);
    z-index: 6;
    filter: drop-shadow(0 4px 6px rgba(201,107,138,.25));
  }

  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 2;
  }

  .envelope-shadow-fold-left,
  .envelope-shadow-fold-right {
    position:absolute; bottom:0; width:0; height:0;
    border-bottom: 100px solid #fce3ea;
    z-index: 3;
  }
  .envelope-shadow-fold-left{
    left:0; border-left:160px solid transparent; border-right:0;
    border-bottom-color:#fbdae4;
  }
  .envelope-shadow-fold-right{
    right:0; border-right:160px solid transparent; border-left:0;
    border-bottom-color:#f6cdd9;
  }

  .envelope-seal {
    position:absolute;
    top: 82px; left: 50%;
    transform: translate(-50%,0);
    width: 54px; height:54px;
    background: radial-gradient(circle at 35% 30%, var(--rose-dark), #a94c6b 80%);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color:#ffe9ef;
    font-size: 22px;
    box-shadow: 0 6px 14px rgba(169,76,107,.5), inset 0 0 0 2px rgba(255,255,255,.25);
    z-index: 8;
    transition: transform .6s ease, opacity .6s ease;
  }
  .envelope.open .envelope-seal {
    transform: translate(-50%,0) scale(0);
    opacity: 0;
  }

  .envelope-letter-peek {
    position:absolute;
    left: 20px; right:20px;
    bottom: 10px;
    height: 130px;
    background: linear-gradient(180deg,#fffdfb,#fff5f7);
    border-radius: 6px;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05);
    z-index: 4;
    transition: transform 1s cubic-bezier(.65,0,.35,1) .15s;
  }
  .envelope.open .envelope-letter-peek {
    transform: translateY(-190px) scale(1.03);
  }

  .envelope-hint {
    text-align:center;
    margin-top: 34px;
    color: var(--rose-dark);
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: .72rem;
    font-family: 'Playfair Display', serif;
  }

  /* ---------- Letter Scene ---------- */
  #letter-scene {
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #letter-scene.show {
    opacity: 1;
    transform: translateY(0);
  }

  .paper-card {
    background: linear-gradient(180deg, #fffdfc 0%, #fff9fa 100%);
    border: 1px solid rgba(232,160,180,.35);
    box-shadow: 0 30px 60px -20px rgba(201,107,138,.35);
    position: relative;
  }
  .paper-card::before {
    content:'';
    position:absolute; inset:10px;
    border: 1px solid rgba(216,178,106,.35);
    pointer-events:none;
  }

  .fade-in-line {
    opacity: 0;
    transform: translateY(14px);
    animation: fadeInLine 1s ease forwards;
  }
  @keyframes fadeInLine {
    to { opacity:1; transform:translateY(0); }
  }

  .shimmer-title {
    background: linear-gradient(90deg, var(--rose-dark), var(--gold), var(--rose-dark));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: -200% center; }
  }

  /* buttons */
  .btn-romantic {
    background: linear-gradient(135deg, var(--rose-dark), #d97e9a);
    color: #fff;
    box-shadow: 0 10px 25px -8px rgba(201,107,138,.6);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .btn-romantic:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 30px -8px rgba(201,107,138,.75);
    filter: brightness(1.05);
  }
  .btn-romantic:active { transform: translateY(0); }

  /* typewriter cursor */
  .typewriter-cursor::after {
    content: '|';
    animation: blink 1s step-end infinite;
    color: var(--rose-dark);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* music note pulse */
  .music-pulsing { animation: pulseNote 1.4s ease-in-out infinite; }
  @keyframes pulseNote {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  /* sparkle divider */
  .sparkle-divider {
    display:flex; align-items:center; gap: .75rem;
    color: var(--rose-deep);
  }
  .sparkle-divider::before, .sparkle-divider::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  ::selection { background: var(--rose); color: #6b2c44; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #fdeef1; }
  ::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--rose-dark); }

  @media (max-width: 480px) {
    .envelope { width: 270px; height: 178px; }
    .envelope-flap { border-left-width: 135px; border-right-width: 135px; border-top-width: 97px; }
    .envelope-shadow-fold-left, .envelope-shadow-fold-right { border-left-width:135px; border-right-width:135px; }
  }
</style>
</head>
<body class="min-h-screen relative">

<!-- ============================================================= -->
<!-- FLOATING HEARTS BACKGROUND (generated by JS, styled here)      -->
<!-- ============================================================= -->
<div id="hearts-container"></div>

<!-- ============================================================= -->
<!-- ENVELOPE SCENE                                                  -->
<!-- ============================================================= -->
<div id="envelope-scene">
  <div class="text-center">
    <p class="font-script text-3xl md:text-4xl text-[color:var(--rose-dark)] mb-6">A letter for you, <span class="js-her-name">Babyyy</span></p>

    <div class="envelope-wrap">
      <div class="envelope" id="envelope" onclick="openEnvelope()">
        <div class="envelope-shadow-fold-left"></div>
        <div class="envelope-shadow-fold-right"></div>
        <div class="envelope-letter-peek"></div>
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-seal"><i class="fa-solid fa-heart"></i></div>
      </div>
    </div>

    <p class="envelope-hint"><i class="fa-solid fa-hand-pointer mr-1"></i> click to open</p>
  </div>
</div>

<!-- ============================================================= -->
<!-- LETTER SCENE                                                    -->
<!-- ============================================================= -->
<div id="letter-scene" class="px-4 py-14 md:py-20">
  <div class="max-w-3xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-10">
      <div class="flex items-center justify-center gap-3 mb-3">
        <i class="fa-solid fa-heart text-[color:var(--rose-dark)] text-xl"></i>
        <span class="uppercase tracking-[0.3em] text-xs md:text-sm text-[color:var(--rose-dark)] font-display">A Letter Written With Love</span>
        <i class="fa-solid fa-heart text-[color:var(--rose-dark)] text-xl"></i>
      </div>
      <h1 class="font-script shimmer-title text-5xl md:text-7xl leading-tight">To <span class="js-her-name">Babyyy</span></h1>
    </div>

    <!-- Paper card -->
    <div class="paper-card rounded-2xl px-6 py-10 md:px-16 md:py-16 mb-12">

      <p class="font-display italic text-center text-[color:var(--plum)] text-lg mb-10">
        My dearest <span class="js-her-name">Babyyy</span>,
      </p>

      <!-- Paragraphs are injected here by JavaScript (see LETTER_PARAGRAPHS below) -->
      <div id="letter-paragraphs" class="space-y-6 text-[1.15rem] md:text-[1.3rem] leading-relaxed text-[color:var(--plum)] font-normal"></div>

      <div class="sparkle-divider my-10">
        <i class="fa-solid fa-heart text-sm"></i>
      </div>

      <p class="font-script text-center text-3xl md:text-4xl text-[color:var(--rose-dark)] mb-2 js-closing-line">
        Forever isn't long enough, but I'd like to spend it trying with you.
      </p>

      <p class="text-right font-display italic mt-10 text-[color:var(--plum)]">
        Forever yours, <br>
        <span class="font-script text-3xl text-[color:var(--rose-dark)] js-my-name">Your Forever</span>
      </p>
    </div>

    <!-- ========================================================= -->
    <!-- ACTION BUTTON                                               -->
    <!-- ========================================================= -->
    <div class="flex flex-col items-center gap-5 mb-10">

      <div class="flex flex-wrap justify-center gap-4">
        <button onclick="toggleSong()" id="song-toggle-btn" class="btn-romantic px-7 py-3 rounded-full font-display text-sm md:text-base tracking-wide">
          <i class="fa-solid fa-music mr-2 music-pulsing" id="song-play-icon"></i> <span id="song-btn-text">Play Our Song</span>
        </button>
      </div>

      <!--
        PLAY OUR SONG:
        Replace the src below with a link to a song you own the rights to,
        e.g. src="assets/our-song.mp3"
      -->
      <audio id="our-song-audio" preload="none" loop>
        <source src="ehe.mp3" type="audio/mpeg">
      </audio>

      <p class="font-script text-2xl text-[color:var(--rose-dark)] mt-6 text-center">
        Thank you for being the best part of my every day.
      </p>
      <i class="fa-solid fa-heart text-[color:var(--rose-dark)] animate-pulse"></i>
    </div>

    <p class="text-center text-xs text-[color:var(--rose-dark)] opacity-70 font-display tracking-widest uppercase mb-4">
      made with <i class="fa-solid fa-heart"></i> for <span class="js-her-name">Babyyy</span>
    </p>
  </div>
</div>

<script>
/* =====================================================================
   PERSONALIZATION (replaces the old PHP $_GET logic)
   Example: index.html?name=Sophia&from=James
   ===================================================================== */
const DEFAULT_NAME = "Babyyy";
const DEFAULT_FROM = "Your Forever";

// EDIT YOUR LETTER HERE — each entry becomes a paragraph in the letter.
// Tip: swap in the names of your actual trips, cities, and little
// adventures wherever you see the text below.
const LETTER_PARAGRAPHS = [
  "From the moment you walked into my life, everything simply made more sense. Colors looked brighter, mornings felt kinder, and every small, ordinary thing turned into something worth smiling about.",
  "I don't think I ever believed in the kind of love that makes you want to be a better person — until you. You make me want to grow, to try harder, to show up more fully, every single day.",
  "We've chased so many horizons together — our trip to the beach, our hike to the mountains, and our adventures to the waterfall. Every one of those days became a memory I hold onto, just because I got to spend it with you.",
  "I still think about our trip to the beach, how we watched the sun sink into the water and you said it was the best day of your life. Then there was our hike to the mountains, both of us out of breath but laughing the whole way up, and our adventures to the waterfall, standing there soaked and happy, not caring about anything else in the world. You find magic in all of it, and you taught me to find it too.",
  "I love you in the loud, obvious ways — the flowers, the late-night calls, the 'I miss you already' texts. But I love you even more in the quiet ways: choosing you on the hard days, choosing you when it's inconvenient, choosing you without ever having to think twice.",
  "Wherever we go next — whether it's back to that same beach, another mountain to climb, or a new waterfall to discover — I already know it'll be my favorite trip yet, simply because you'll be there.",
  "Whatever life brings us next, I hope it always brings us back to each other. You are my favorite person, my softest place to land, and my most beautiful adventure."
];

// Closing signature line — feel free to edit
const CLOSING_LINE = "Forever isn't long enough, but I'd like to spend it trying with you.";

function getParam(key, fallback) {
  const params = new URLSearchParams(window.location.search);
  const val = params.get(key);
  return (val && val.trim() !== '') ? val.trim() : fallback;
}

const herName = getParam('name', DEFAULT_NAME);
const myName = getParam('from', DEFAULT_FROM);

// Update <title> and all name placeholders (textContent is used everywhere,
// which safely escapes any HTML the same way htmlspecialchars() did)
document.title = 'A Love Letter for ' + herName;
document.querySelectorAll('.js-her-name').forEach(el => el.textContent = herName);
document.querySelectorAll('.js-my-name').forEach(el => el.textContent = myName);
document.querySelector('.js-closing-line').textContent = CLOSING_LINE;

// Render the letter paragraphs with the same staggered fade-in timing
const paragraphsContainer = document.getElementById('letter-paragraphs');
LETTER_PARAGRAPHS.forEach((para, i) => {
  const p = document.createElement('p');
  p.className = 'fade-in-line';
  p.style.animationDelay = (0.3 + i * 0.35) + 's';
  p.textContent = para;
  paragraphsContainer.appendChild(p);
});

/* =====================================================================
   FLOATING HEARTS
   ===================================================================== */
function spawnHeart() {
  const container = document.getElementById('hearts-container');
  const heart = document.createElement('i');
  const icons = ['fa-solid fa-heart', 'fa-regular fa-heart', 'fa-solid fa-heart'];
  heart.className = 'floating-heart ' + icons[Math.floor(Math.random() * icons.length)];

  const size = 12 + Math.random() * 22; // 12-34px
  const left = Math.random() * 100; // vw
  const duration = 9 + Math.random() * 10; // seconds
  const scale = 0.6 + Math.random() * 0.9;

  heart.style.left = left + 'vw';
  heart.style.fontSize = size + 'px';
  heart.style.animationDuration = duration + 's';
  heart.style.setProperty('--s', scale);

  container.appendChild(heart);

  setTimeout(() => heart.remove(), duration * 1000 + 500);
}

// Spawn hearts continuously
setInterval(spawnHeart, 650);
for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 300); // initial burst

/* =====================================================================
   ENVELOPE OPENING
   ===================================================================== */
function openEnvelope() {
  const envelope = document.getElementById('envelope');
  if (envelope.classList.contains('open')) return;
  envelope.classList.add('open');

  setTimeout(() => {
    document.getElementById('envelope-scene').classList.add('hidden-scene');
    document.getElementById('letter-scene').classList.add('show');
    document.body.style.overflow = 'auto';
    // little confetti-esque heart burst
    for (let i = 0; i < 18; i++) setTimeout(spawnHeart, i * 60);
  }, 1150);
}

// lock scroll until opened
document.body.style.overflow = 'hidden';

/* =====================================================================
   PLAY OUR SONG (plays/pauses directly, no popup)
   ===================================================================== */
const songAudio = document.getElementById('our-song-audio');
const songSource = songAudio.querySelector('source');

function resetSongButton() {
  const icon = document.getElementById('song-play-icon');
  const text = document.getElementById('song-btn-text');
  icon.className = 'fa-solid fa-music mr-2 music-pulsing';
  text.textContent = 'Play Our Song';
}

function toggleSong() {
  const icon = document.getElementById('song-play-icon');
  const text = document.getElementById('song-btn-text');

  // Check the actual configured file path, not the browser-resolved audio.src
  const hasSong = songSource && songSource.getAttribute('src') && songSource.getAttribute('src').trim() !== '';

  if (!hasSong) {
    text.textContent = 'Add your song file in the code ♥';
    setTimeout(() => { text.textContent = 'Play Our Song'; }, 2200);
    return;
  }

  if (songAudio.paused) {
    songAudio.play().then(() => {
      icon.className = 'fa-solid fa-pause mr-2';
      text.textContent = 'Pause';
    }).catch(() => {
      text.textContent = 'Could not play song';
      setTimeout(() => { text.textContent = 'Play Our Song'; }, 2200);
    });
  } else {
    songAudio.pause();
    resetSongButton();
  }
}

// Reset button automatically if the song ever stops (loop makes this rare)
songAudio.addEventListener('ended', resetSongButton);
</script>

</body>
</html>
